<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오늘의 괘</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#0A0A0A;
    --fg:#FFFFFF;
    --muted:#9A9A9A;
    --line:#2A2A2A;
    --accent:#F5A03C;
    --card:#111111;
    --radius:8px;
    --btn-radius:6px;
    --gap:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:28px 20px calc(32px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }
  header{text-align:center;margin-bottom:24px;}
  header h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:14px;
    color:var(--muted);
  }
  .accent{color:var(--accent);}

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:var(--gap);
  }

  /* 초기 안내 */
  .intro{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    padding:24px 8px;
  }
  .intro .mark{font-size:40px;color:var(--accent);line-height:1;margin-bottom:12px;}

  /* 결과 카드 */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .card.show{opacity:1;transform:none;}

  .hexno{
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:4px;
  }
  .hexname{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  .hexhanja{
    font-size:15px;
    color:var(--muted);
    margin-top:2px;
  }

  /* 괘상 */
  .gua{
    display:flex;
    flex-direction:column;
    gap:9px;
    align-items:center;
    margin:20px auto 14px;
    width:168px;
  }
  .linerow{position:relative;width:100%;display:flex;justify-content:center;}
  .yao{display:flex;gap:12px;height:12px;width:128px;}
  .yao .bar{background:var(--fg);border-radius:2px;height:100%;}
  .yao.yang .bar{width:100%;}
  .yao.yin .bar{width:calc(50% - 6px);}
  .linerow.chg .yao .bar{background:var(--accent);}
  .chgmark{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:13px;line-height:1;color:var(--accent);font-weight:800;}
  .marklegend{text-align:center;font-size:11px;color:var(--muted);margin:0 0 4px;}

  /* 지괘 */
  .toGua{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);}
  .toGua .tolabel{text-align:center;font-size:12px;color:var(--accent);letter-spacing:.06em;font-weight:700;margin-bottom:12px;}
  .toGua .hexname{font-size:22px;font-weight:800;margin:0;}
  .nochg{margin-top:16px;text-align:center;font-size:13px;color:var(--muted);}

  /* 상하괘 */
  .trigrams{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .tri{
    flex:1;
    background:#0d0d0d;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    text-align:center;
  }
  .tri .role{font-size:11px;color:var(--muted);letter-spacing:.06em;}
  .tri .sym{font-size:26px;color:var(--accent);line-height:1.1;margin:4px 0 2px;}
  .tri .tname{font-size:14px;font-weight:700;}
  .tri .tnat{font-size:12px;color:var(--muted);}

  /* 풀이 */
  .reading{margin-top:18px;}
  .reading h3{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
    margin:0 0 6px;
    font-weight:700;
    text-transform:uppercase;
  }
  .reading .gua-txt{font-size:15px;margin:0 0 14px;}
  .reading .adv-txt{
    font-size:15px;
    margin:0;
    padding-left:12px;
    border-left:2px solid var(--accent);
    color:#e9e9e9;
  }

  /* 버튼 */
  .actions{margin-top:26px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    width:100%;
    font-weight:800;
    letter-spacing:.02em;
  }
  .draw-btn{
    background:var(--accent);
    color:#160a00;
    font-size:18px;
    padding:16px;
    border-radius:var(--btn-radius);
    transition:filter .15s ease, transform .05s ease;
  }
  .draw-btn:hover{filter:brightness(1.07);}
  .draw-btn:active{transform:scale(.99);}
  .again-btn{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--line);
    font-size:15px;
    font-weight:700;
    padding:14px;
    border-radius:var(--btn-radius);
    transition:border-color .15s ease, color .15s ease;
  }
  .again-btn:hover{border-color:var(--accent);}
  .btnrow{display:flex;gap:10px;}
  .btnrow button{flex:1;}
  button:disabled{opacity:.7;cursor:default;}

  footer{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color:#5a5a5a;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>오늘의 <span class="accent">괘</span></h1>
      <p>버튼을 눌러 지금의 괘를 뽑아보세요</p>
    </header>

    <main class="stage" id="stage">
      <div class="intro" id="intro">
        <div class="mark">☯</div>
        마음을 가다듬고<br />아래 버튼을 눌러보세요
      </div>
    </main>

    <div class="actions" id="actions">
      <button class="draw-btn" id="drawBtn">괘 뽑기</button>
    </div>

    <footer>동전 세 닢을 여섯 번 던져 뽑고, 변효가 있으면 지괘까지 보여줍니다</footer>
  </div>

<script>
/* ---- 팔괘 (아래→위 순서, 1=양 0=음) ---- */
const TRI = {
  geon:{bits:[1,1,1], name:"건", hanja:"乾", nat:"하늘", sym:"☰"},
  tae :{bits:[1,1,0], name:"태", hanja:"兌", nat:"못",   sym:"☱"},
  ri  :{bits:[1,0,1], name:"리", hanja:"離", nat:"불",   sym:"☲"},
  jin :{bits:[1,0,0], name:"진", hanja:"震", nat:"우레", sym:"☳"},
  son :{bits:[0,1,1], name:"손", hanja:"巽", nat:"바람", sym:"☴"},
  gam :{bits:[0,1,0], name:"감", hanja:"坎", nat:"물",   sym:"☵"},
  gan :{bits:[0,0,1], name:"간", hanja:"艮", nat:"산",   sym:"☶"},
  gon :{bits:[0,0,0], name:"곤", hanja:"坤", nat:"땅",   sym:"☷"}
};
const triByBits = {};
for(const k in TRI){ triByBits[TRI[k].bits.join("")] = k; }

/* ---- 64괘 (up=상괘, lo=하괘) ---- */
const HEX = [
 {n:1, k:"중천건", h:"重天乾", up:"geon", lo:"geon", gua:"하늘의 굳건한 기운. 크게 형통하고 바르게 함이 이롭다.", adv:"지금은 적극적으로 나아갈 때. 다만 교만을 경계하라."},
 {n:2, k:"중지곤", h:"重地坤", up:"gon", lo:"gon", gua:"땅의 너그러운 덕. 유순함과 포용으로 만물을 기른다.", adv:"앞장서기보다 받아들이고 따를 때 일이 이루어진다."},
 {n:3, k:"수뢰둔", h:"水雷屯", up:"gam", lo:"jin", gua:"초목이 처음 돋는 어려움. 시작은 험하나 바르게 지키면 통한다.", adv:"서두르지 말고 기반부터 다져라. 도움을 구하는 게 좋다."},
 {n:4, k:"산수몽", h:"山水蒙", up:"gan", lo:"gam", gua:"어림과 몽매함. 가르치고 깨우치면 형통하다.", adv:"모르는 건 배우고 물어라. 조급함이 가장 큰 적이다."},
 {n:5, k:"수천수", h:"水天需", up:"gam", lo:"geon", gua:"기다림. 때가 무르익기를 믿음으로 기다린다.", adv:"지금은 나설 때가 아니다. 준비하며 때를 기다려라."},
 {n:6, k:"천수송", h:"天水訟", up:"geon", lo:"gam", gua:"다툼과 송사. 끝까지 다투면 흉하니 중도에 그침이 좋다.", adv:"이기려 들지 말고 물러서 화해하는 길을 찾아라."},
 {n:7, k:"지수사", h:"地水師", up:"gon", lo:"gam", gua:"무리를 이끄는 군대. 바른 명분과 어른의 지도가 있어야 길하다.", adv:"질서와 원칙을 세워 사람들을 이끌어라."},
 {n:8, k:"수지비", h:"水地比", up:"gam", lo:"gon", gua:"친밀하게 돕고 따름. 바르게 어울리면 길하다.", adv:"좋은 사람들과 가까이하고 진심으로 협력하라."},
 {n:9, k:"풍천소축", h:"風天小畜", up:"son", lo:"geon", gua:"작게 쌓고 기름. 아직 큰 힘은 없으나 조금씩 모인다.", adv:"작은 것을 꾸준히 쌓아라. 큰 결실은 아직 이르다."},
 {n:10, k:"천택리", h:"天澤履", up:"geon", lo:"tae", gua:"호랑이 꼬리를 밟듯 조심히 행함. 예로써 처신하면 형통하다.", adv:"위태로운 자리일수록 예의와 조심으로 처신하라."},
 {n:11, k:"지천태", h:"地天泰", up:"gon", lo:"geon", gua:"하늘과 땅이 사귀어 통함. 크게 길하고 형통하다.", adv:"흐름이 트였다. 조화롭게 베풀면 더 좋아진다."},

 {n:18, k:"산풍고", h:"山風蠱", up:"gan", lo:"son", gua:"묵은 폐단을 바로잡음. 어지러움을 고치면 크게 형통하다.", adv:"곪은 문제를 미루지 말고 지금 바로잡아라."},
 {n:19, k:"지택림", h:"地澤臨", up:"gon", lo:"tae", gua:"다가가 임함. 때가 성하니 크게 형통하나 끝을 경계하라.", adv:"기회가 다가온다. 적극적으로 임하되 교만을 조심하라."},
 {n:20, k:"풍지관", h:"風地觀", up:"son", lo:"gon", gua:"살펴봄. 우러러 보고 깊이 관찰한다.", adv:"행동보다 먼저 넓게 살피고 성찰하라."},
 {n:21, k:"화뢰서합", h:"火雷噬嗑", up:"ri", lo:"jin", gua:"씹어 합함. 장애를 깨물어 없애면 형통하다.", adv:"걸림돌은 분명하게 끊어내야 일이 통한다."},
 {n:22, k:"산화비", h:"山火賁", up:"gan", lo:"ri", gua:"꾸미고 빛냄. 바탕 위에 문채를 더하니 작게 형통하다.", adv:"겉을 꾸미되 본질을 잊지 마라."},
 {n:23, k:"산지박", h:"山地剝", up:"gan", lo:"gon", gua:"깎여 떨어짐. 소인이 성하니 나아감이 이롭지 않다.", adv:"무너지는 때다. 움직이지 말고 지켜라."},
 {n:24, k:"지뢰복", h:"地雷復", up:"gon", lo:"jin", gua:"돌아옴. 양이 다시 돌아오니 형통하다.", adv:"바닥을 지났다. 처음 마음으로 다시 시작하라."},
 {n:25, k:"천뢰무망", h:"天雷无妄", up:"geon", lo:"jin", gua:"거짓 없는 자연스러움. 바르면 형통하나 그릇되면 재앙이다.", adv:"꾸밈 없이 바르게 하라. 억지 욕심은 화를 부른다."},

 {n:39, k:"수산건", h:"水山蹇", up:"gam", lo:"gan", gua:"절뚝임, 험난함. 나아감이 어려우니 돌이켜 도움을 구한다.", adv:"막힐 땐 무리하지 말고 어진 이에게 도움을 구하라."},

const hexByKey = {};
for(const x of HEX){ hexByKey[x.up + "-" + x.lo] = x; }

/* ---- 뽑기: 동전 세 닢 × 여섯 번 (척전법) ---- */
function tossLineType(){
  // 동전 앞=3, 뒤=2. 세 닢의 합: 6 노음 / 7 소양 / 8 소음 / 9 노양
  let sum = 0;
  for(let c=0;c<3;c++){ sum += (Math.random()<0.5 ? 3 : 2); }
  return sum;
}
function drawHex(){
  const lines = [], chg = [];       // index 0 = 맨 아래(초효)
  for(let i=0;i<6;i++){
    const t = tossLineType();
    lines.push( (t===7 || t===9) ? 1 : 0 );   // 양: 7,9 / 음: 6,8
    chg.push( (t===6 || t===9) );             // 변효: 노음6, 노양9
  }
  const loKey = triByBits[ lines.slice(0,3).join("") ];
  const upKey = triByBits[ lines.slice(3,6).join("") ];
  const hex = hexByKey[ upKey + "-" + loKey ];

  const hasChg = chg.some(Boolean);
  let toHex = null, toLines = null;
  if(hasChg){
    toLines = lines.map((v,i)=> chg[i] ? (v===1 ? 0 : 1) : v);  // 변효를 뒤집어 지괘
    const tLoKey = triByBits[ toLines.slice(0,3).join("") ];
    const tUpKey = triByBits[ toLines.slice(3,6).join("") ];
    toHex = hexByKey[ tUpKey + "-" + tLoKey ];
  }
  return { hex, lines, chg, upKey, loKey, hasChg, toHex, toLines };
}
function buildGua(lines, chg){
  let html = "";
  for(let i=5;i>=0;i--){                      // 위(6효)부터 아래(초효)로
    const yang = lines[i] === 1;
    const changing = chg && chg[i];
    const bars = yang
      ? '<span class="bar"></span>'
      : '<span class="bar"></span><span class="bar"></span>';
    const mark = changing
      ? '<span class="chgmark">' + (yang ? '○' : '×') + '</span>'
      : '';
    html += '<div class="linerow' + (changing ? ' chg' : '') + '">'
          +   '<div class="yao ' + (yang ? 'yang' : 'yin') + '">' + bars + '</div>'
          +   mark
          + '</div>';
  }
  return html;
}

/* ---- 렌더 ---- */
const stage = document.getElementById('stage');
const actions = document.getElementById('actions');
let current = null;

function render(d){

  const up = TRI[upKey], lo = TRI[loKey];

  const legend = hasChg
    ? '<div class="marklegend">○ 노양(양→음) · × 노음(음→양)</div>'
    : '';

  const toBlock = hasChg
    ? `

        <div class="tolabel">▼ 변하여 — 지괘</div>

        <div class="hexname">${toHex.k}</div>
        <div class="hexhanja">${toHex.h}</div>
        <div class="gua">${buildGua(toLines, null)}</div>
        <div class="reading">

          <div class="tname">${up.name}(${up.hanja})</div>
          <div class="tnat">${up.nat}</div>
        </div>
        <div class="tri">
          <div class="role">하괘</div>
          <div class="sym">${lo.sym}</div>
          <div class="tname">${lo.name}(${lo.hanja})</div>
          <div class="tnat">${lo.nat}</div>
        </div>
      </div>

      <div class="reading">
        <h3>괘사</h3>
        <p class="gua-txt">${hex.gua}</p>
        <h3>오늘의 조언</h3>
        <p class="adv-txt">${hex.adv}</p>
      </div>

      ${toBlock}
    </div>`;
  actions.innerHTML =
    '<div class="btnrow">' +
      '<button class="again-btn" id="copyBtn">결과 복사</button>' +
      '<button class="again-btn" id="againBtn">다시 뽑기</button>' +
    '</div>';
  requestAnimationFrame(()=> document.getElementById('card').classList.add('show'));
  document.getElementById('againBtn').addEventListener('click', onDraw);
  document.getElementById('copyBtn').addEventListener('click', copyResult);
}

/* ---- 결과만 텍스트로 복사 (해석 제외) ---- */
function yaoName(i){ return i===0 ? "초효" : (i===5 ? "상효" : (i+1)+"효"); }
function resultText(d){
  let s = "[오늘의 괘]\n";
  s += "본괘: " + d.hex.n + " " + d.hex.k + " (" + d.hex.h + ")\n";
  if(d.hasChg){
    const marks = [];
    for(let i=0;i<6;i++){ if(d.chg[i]) marks.push(yaoName(i)); }
    s += "변효: " + marks.join(", ") + "\n";
    s += "지괘: " + d.toHex.n + " " + d.toHex.k + " (" + d.toHex.h + ")";
  } else {
    s += "변효: 없음";
  }
  return s;
}
function flash(btn, msg){
  const prev = btn.textContent;
  btn.textContent = msg; btn.disabled = true;
  setTimeout(()=>{ btn.textContent = prev; btn.disabled = false; }, 1400);
}
function fallbackCopy(text, btn){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    flash(btn, "복사됨");
  }catch(e){ flash(btn, "복사 실패"); }
}
function copyResult(){
  if(!current) return;
  const text = resultText(current);
  const btn = document.getElementById('copyBtn');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>flash(btn,"복사됨")).catch(()=>fallbackCopy(text, btn));
  } else {
    fallbackCopy(text, btn);
  }
}

function onDraw(){
  current = drawHex();
  render(current);
}
document.getElementById('drawBtn').addEventListener('click', onDraw);
